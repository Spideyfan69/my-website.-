<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
       
        <!-- Header -->
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Student Management</h1>

        <!-- Success Alert Message -->
        <div id="successMessage" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded-md text-sm">
            Student added successfully.
        </div>

        <!-- Student Form -->
        <form id="studentForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <input
                type="text"
                id="studentName"
                placeholder="Student name"
                required
                class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <input
                type="email"
                id="studentEmail"
                placeholder="Email"
                required
                class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <select
                id="studentProgram"
                required
                class="px-4 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
                <option value="" disabled selected>Select program</option>
                <option value="BSIT">BSIT</option>
                <option value="BSIS">BSIS</option>
                <option value="BSCS">BSCS</option>
            </select>
            <button
                type="submit"
                id="submitBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200"
            >
                Add Student
            </button>
        </form>

        <!-- Students Table -->
        <div class="overflow-x-auto border border-gray-200 rounded-md">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white">
                        <th class="py-3 px-4 font-semibold">Name</th>
                        <th class="py-3 px-4 font-semibold">Email</th>
                        <th class="py-3 px-4 font-semibold">Program</th>
                        <th class="py-3 px-4 font-semibold">Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-gray-200 text-gray-700">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Load saved students from browser storage
        let students = JSON.parse(localStorage.getItem("students")) || [
            { id: 1, name: "Ana", email: "ana@gmail.com", program: "BSIT" },
            { id: 2, name: "Almeya", email: "alm@yahoo.com", program: "BSIS" },
            { id: 3, name: "Ian", email: "ian@gmail.com", program: "BSIS" }
        ];
        let editingId = null;

        const studentForm = document.getElementById("studentForm");
        const studentNameInput = document.getElementById("studentName");
        const studentEmailInput = document.getElementById("studentEmail");
        const studentProgramInput = document.getElementById("studentProgram");
        const studentTableBody = document.getElementById("studentTableBody");
        const successMessage = document.getElementById("successMessage");
        const submitBtn = document.getElementById("submitBtn");

        // Save students to browser storage
        function saveStudents() {
            localStorage.setItem("students", JSON.stringify(students));
        }

        // Render table rows
        function renderTable() {
            studentTableBody.innerHTML = "";
           
            if (students.length === 0) {
                studentTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500">No students found.</td></tr>`;
                return;
            }

            students.forEach((student) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="py-3 px-4">${student.name}</td>
                    <td class="py-3 px-4">${student.email}</td>
                    <td class="py-3 px-4">${student.program}</td>
                    <td class="py-3 px-4 space-x-2">
                        <button onclick="editStudent(${student.id})" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1 rounded transition">Edit</button>
                        <button onclick="deleteStudent(${student.id})" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1 rounded transition">Delete</button>
                    </td>
                `;
                studentTableBody.appendChild(tr);
            });
        }

        // Show alert message function
        function showMessage(text) {
            successMessage.textContent = text;
            successMessage.classList.remove("hidden");
            setTimeout(() => {
                successMessage.classList.add("hidden");
            }, 3000);
        }

        // Handle Form Submit (Add or Update)
        studentForm.addEventListener("submit", function (e) {
            e.preventDefault();
           
            const name = studentNameInput.value.trim();
            const email = studentEmailInput.value.trim();
            const program = studentProgramInput.value;

            if (!name || !email || !program) return;

            if (editingId !== null) {
                // Update existing student
                students = students.map(s => s.id === editingId ? { ...s, name, email, program } : s);
                showMessage("Student updated successfully.");
                editingId = null;
                submitBtn.textContent = "Add Student";
                submitBtn.classList.replace("bg-amber-600", "bg-blue-600");
                submitBtn.classList.replace("hover:bg-amber-700", "hover:bg-blue-700");
            } else {
                // Add new student
                const newStudent = {
                    id: Date.now(),
                    name,
                    email,
                    program
                };
                students.push(newStudent);
                showMessage("Student added successfully.");
            }

            saveStudents();
            renderTable();
            studentForm.reset();
        });

        // Edit Student
        window.editStudent = function (id) {
            const student = students.find(s => s.id === id);
            if (student) {
                studentNameInput.value = student.name;
                studentEmailInput.value = student.email;
                studentProgramInput.value = student.program;
                editingId = id;
                submitBtn.textContent = "Update Student";
                submitBtn.classList.replace("bg-blue-600", "bg-amber-600");
                submitBtn.classList.replace("hover:bg-blue-700", "hover:bg-amber-700");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // Delete Student
        window.deleteStudent = function (id) {
            if (confirm("Are you sure you want to delete this student?")) {
                students = students.filter(s => s.id !== id);
                saveStudents();
                renderTable();
                showMessage("Student deleted successfully.");
            }
        };

        // Initial render on page load
        renderTable();
    </script>
</body>
</html>
